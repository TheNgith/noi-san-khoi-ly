<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/colors.css" />
        <link rel="stylesheet" href="styles/navbar.css" />
        <link rel="stylesheet" href="styles/sidebar.css" />
        <link rel="stylesheet" href="styles/toolbar.css" />
        <link rel="stylesheet" href="styles/pages.css" />
        <link rel="stylesheet" href="styles/comments.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="stylesheet" href="styles/cover.css" />
        <title>Document</title>
    </head>
    <body>
        <nav class="navbar">
            <img src="assets/icons/logo.svg" alt="logo_noisan" class="logo" />
            <div class="button_container">
                <div class="link_container_navbar">
                    <div class="link_title_navbar">Giới thiệu</div>
                    <div class="link_underline_navbar default"></div>
                </div>
                <div class="link_container_navbar">
                    <div class="link_title_navbar">Liên hệ</div>
                    <div class="link_underline_navbar default"></div>
                </div>
            </div>
        </nav>
        <div class="cover_container">
            <img src="assets/icons/cover_shape.svg" alt="cover" class="cover" />
        </div>
        <!-- Chapters are built from scripts/pages.gen.js (buildPages.js) -->
        <div class="pages_container"></div>
        <div class="hover-edge" aria-hidden="true"></div>
        <div class="sidebar-hint" aria-hidden="true">
            <i class="fa-solid fa-chevron-right"></i>
        </div>
        <aside class="sidebar default">
            <div class="link_container_navbar">
                <div class="link_title_navbar">Mục lục</div>
                <div class="link_underline_navbar default"></div>
            </div>
            <ul></ul>
        </aside>
        <div class="toolbar_container">
            <div class="zoom_container">
                <button class="zoom_in_btn">
                    <img src="assets/icons/zoomIn.svg" alt="Zoom in" />
                </button>
                <div class="zoom_percent">100%</div>
                <button class="zoom_out_btn">
                    <img src="assets/icons/zoomOut.svg" alt="Zoom out" />
                </button>
            </div>
            <div class="page_mode_container">
                <button class="dual_page_toggler">
                    <img src="assets/icons/single_page_mode.svg" alt="Page mode" class="page_mode_icon single" />
                    <img src="assets/icons/dual_page_mode.svg" alt="Page mode" class="page_mode_icon dual" style="display:none;" />
                </button>
                <div class="page-mode-hint">Đọc với trang đôi</div>
            </div>
            <div class="download_container">
                <div class="download_icon">
                    <img src="assets/icons/download.svg" alt="Download" />
                </div>
                <div class="download_options_container">
                    <button class="dl_thischap_btn">Tải chương này</button>
                    <button class="dl_all_btn">Tải toàn bộ</button>
                </div>
            </div>
            <div class="cmt_toggle_container">
                <button id="toggleOverlayBtn" class="cmt_toggle_btn on">
                    <img src="assets/icons/cmt_mode_on.svg" alt="Comment mode" class="cmt_icon" />
                </button>
                <div class="cmt-hint">Tắt chế độ trang đôi để bình luận</div>
            </div>
        </div>
        <script type="module" src="scripts/app.js"></script>
    </body>
</html>
