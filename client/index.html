<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/colors.css" />
        <link rel="stylesheet" href="styles/navbar.css" />
        <link rel="stylesheet" href="styles/cover.css" />
        <link rel="stylesheet" href="styles/toc.css" />
        <link rel="stylesheet" href="styles/toolbar.css" />
        <link rel="stylesheet" href="styles/pages.css" />
        <link rel="stylesheet" href="styles/comments.css" />
        <link rel="stylesheet" href="styles/eggs.css" />
        <link rel="stylesheet" href="styles/gate.css" />
        <title>L9622 – Nội san khối Lý</title>
    </head>
    <body class="page-reader">
        <nav class="navbar over-cover">
            <a href="index.html"><img src="assets/icons/logo.svg" alt="L9622, nội san khối Lý" class="logo" /></a>
            <div class="button_container">
                <a href="about.html" class="link_container_navbar">
                    <div class="link_title_navbar">Giới thiệu</div>
                    <div class="link_underline_navbar default"></div>
                </a>
                <a href="contact.html" class="link_container_navbar">
                    <div class="link_title_navbar">Liên hệ</div>
                    <div class="link_underline_navbar default"></div>
                </a>
            </div>
        </nav>

        <!-- Cover: page 1 of the PDF (tools/pages/build.mjs), a picture only -->
        <section class="cover_container" aria-label="Bìa">
            <img
                src="assets/pages/cover.svg"
                alt="Bìa L9622: Nội san khối Lý, 1996–2022, bởi PTNK L1922"
                class="cover-card"
            />
        </section>

        <!-- Pages are built from scripts/book.js -->
        <main class="pages_container" id="reader" aria-label="Nội dung sách"></main>

        <div class="toc-veil"></div>
        <nav class="toc-spine" aria-label="Mục lục">
            <div class="toc-sheet"></div>
            <div class="toc-title">
                <span>Mục lục</span>
                <span class="glow-ul glow"></span>
            </div>
            <div class="toc-rows"></div>
        </nav>

        <div class="toolbar_container">
            <div class="zoom_container">
                <button class="zoom_in_btn" type="button" data-hint="Phóng to (+)" aria-label="Phóng to">
                    <img src="assets/icons/zoomIn.svg" alt="" />
                </button>
                <button class="zoom_percent" type="button" data-hint="Về vừa chiều cao" aria-label="Mức thu phóng">100%</button>
                <button class="zoom_out_btn" type="button" data-hint="Thu nhỏ (−)" aria-label="Thu nhỏ">
                    <img src="assets/icons/zoomOut.svg" alt="" />
                </button>
            </div>
            <button class="fit_btn" type="button" data-hint="Vừa chiều rộng (F)" aria-label="Vừa chiều rộng">
                <!-- The page is the same rectangle, and line, as single_page_mode.svg at 25px -->
                <svg class="fit_icon width" viewBox="0 0 31 25" fill="none" stroke="white" stroke-width="1.5625">
                    <path d="M7.6875 .868h15.625v23.264H7.6875z" />
                    <path d="M.8 12.5h29.4M4 9.3l-3.2 3.2 3.2 3.2M27 9.3l3.2 3.2-3.2 3.2" />
                </svg>
                <svg class="fit_icon height" viewBox="0 0 25 31" fill="none" stroke="white" stroke-width="1.5625" hidden>
                    <path d="M4.6875 3.868h15.625v23.264H4.6875z" />
                    <path d="M12.5 .8v29.4M9.3 4l3.2-3.2 3.2 3.2M9.3 27l3.2 3.2 3.2-3.2" />
                </svg>
            </button>
            <button class="dual_page_toggler" type="button" data-hint="Đọc với trang đôi (D)" aria-label="Đọc với trang đôi" aria-pressed="false">
                <img src="assets/icons/single_page_mode.svg" alt="" class="page_mode_icon single" />
                <img src="assets/icons/dual_page_mode.svg" alt="" class="page_mode_icon dual" hidden />
            </button>
            <div class="download_container">
                <div class="download_icon">
                    <img src="assets/icons/download.svg" alt="Tải xuống" />
                </div>
                <div class="download_options_container">
                    <button class="dl_thischap_btn" type="button">Tải chương này</button>
                    <button class="dl_all_btn" type="button">Tải toàn bộ</button>
                </div>
            </div>
            <button class="toc_btn" type="button" aria-label="Mở mục lục">
                <span>Mục lục</span>
                <span class="glow-ul glow"></span>
            </button>
            <button class="cmt_toggle_btn" type="button" data-hint="Ẩn bình luận" aria-label="Ẩn bình luận" aria-pressed="true">
                <img src="assets/icons/cmt_mode_on.svg" alt="" class="cmt_icon" />
            </button>
        </div>

        <div class="sheet-scrim" id="sheet-scrim"></div>
        <div class="comment-sheet" id="comment-sheet" role="dialog" aria-label="Bình luận">
            <div class="sheet-grip"></div>
            <div class="sheet-bar glow"></div>
            <div class="sheet-body"></div>
        </div>
        <div class="tool-hint" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status"></div>

        <script type="module" src="scripts/app.js"></script>
    </body>
</html>
